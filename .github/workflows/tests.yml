name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check assembler and linker
        run: as --version | head -1 && ld --version | head -1
      - name: Run the test suite
        run: python3 tests/run_tests.py
